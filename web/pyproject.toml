[project]
name = "edgechess-web"
version = "0.1.0"
description = "Virtual chess camera and ONNX CPU and RKNN NPU chess inference on Linux"
requires-python = ">=3.10,<3.13"
dependencies = [
  "anyio>=4,<5",
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.3",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "onnxruntime==1.20.1",
  "pillow==11.2.1",
]

[project.optional-dependencies]
rknn = ["rknn-toolkit-lite2==2.3.2; platform_machine == 'aarch64'"]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
