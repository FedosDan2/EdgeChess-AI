[project]
name = "edgechess-convert"
version = "0.1.0"
description = "CPU export, validation and RKNN quantization of YOLOv8 on Linux"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "ultralytics==8.3.161",
    "rknn-toolkit2==2.3.2",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "onnx==1.16.1",
    "onnxruntime==1.20.1",
    "protobuf==4.25.4",
    "dill==0.3.8",
    # Toolkit2 imports pkg_resources at runtime but omits it from its metadata.
    "setuptools==75.8.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
# Pin the official CPython 3.10 / Linux x86_64 SDK wheel: this release's wheels
# have different dependency metadata. No dependency constraints are overridden.
rknn-toolkit2 = { url = "https://files.pythonhosted.org/packages/58/5e/2b347a2c4430427ba1cfefdcd6ea12ecaa6de3465a39d45f2a9d685b2b34/rknn_toolkit2-2.3.2-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
